name: Build

on:
  push:
    branches: [main, linux-port]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        shell: cmd
        run: '"%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /optimize+ /out:DesktopRecorder.exe /r:System.Windows.Forms.dll /r:System.Drawing.dll /win32manifest:DesktopRecorder.manifest /win32icon:app.ico RecorderCore.cs RecordingSession.cs NativeMethods.cs RegionSelector.cs RecordingFrame.cs DesktopRecorder.cs'
      - uses: actions/upload-artifact@v4
        with:
          name: DesktopRecorder
          path: DesktopRecorder.exe

  linux:
    runs-on: ubuntu-24.04
    env:
      # A missing package fails a test. It does not skip it (DESIGN.md D23).
      DESKTOP_RECORDER_REQUIRE_GUI: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Ubuntu 24.04 packages
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            mono-devel libmono-system-windows-forms4.0-cil libmono-system-drawing4.0-cil \
            python3 python3-gi python3-gi-cairo python3-xlib gir1.2-gtk-3.0 \
            gir1.2-gstreamer-1.0 gir1.2-notify-0.7 gstreamer1.0-plugins-base \
            ffmpeg xvfb xdotool x11-utils x11-xserver-utils dbus
      - name: Unit tests
        run: |
          env -u DISPLAY PYTHONPATH=linux python3 -m unittest discover -s tests -p 'test_linux*.py' -v
          PYTHONPATH=linux python3 -m unittest discover -s tests -p 'test_pdeathsig.py' -v
          PYTHONPATH=linux python3 -m unittest discover -s tests -p 'test_gst_pipeline.py' -v
      - name: Core tests (Mono)
        run: |
          mcs -sdk:4.5 -nologo -target:exe -out:/tmp/desktop-recorder-tests.exe \
            tests/CoreTests.cs RecorderCore.cs RecordingSession.cs
          mono /tmp/desktop-recorder-tests.exe
      - name: GUI tests
        run: dbus-run-session -- xvfb-run -a -s "-screen 0 1280x800x24" env PYTHONPATH=linux python3 -m unittest discover -s tests -p 'test_x11*.py' -v
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: linux-test-output
          path: ${{ runner.temp }}/dr-tests

  tarball:
    # The portable archive on a runner with only the apt line of packaging/linux/README.txt
    # (the user setup), plus xvfb and xdotool for this test.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install the README packages (exact copy of the user lines)
        run: |
          set -euo pipefail
          # Take the "sudo apt update" and "sudo apt install ..." lines from README.txt
          # as they are, so this job tests the line that users copy.
          awk '/^    sudo apt update$/ {on=1} on && /^$/ {exit} on {print}' packaging/linux/README.txt \
            | sed 's/^    //' > "$RUNNER_TEMP/user-apt.sh"
          echo "--- user apt lines:"
          cat "$RUNNER_TEMP/user-apt.sh"
          grep -q '^sudo apt install ffmpeg ' "$RUNNER_TEMP/user-apt.sh"
          # apt asks "Do you want to continue?" with no terminal. Answer yes without a change to the lines.
          echo 'APT::Get::Assume-Yes "true";' | sudo tee /etc/apt/apt.conf.d/90-ci-assume-yes >/dev/null
          export DEBIAN_FRONTEND=noninteractive
          bash -euo pipefail "$RUNNER_TEMP/user-apt.sh"
          sudo apt-get install -y xvfb xdotool
      - name: Make the archive
        run: |
          set -euo pipefail
          archive=$(sh packaging/make-linux-tarball.sh "" "$RUNNER_TEMP" | tail -n 1)
          test -f "$archive"
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - name: Unpack and run from the unpacked folder
        run: |
          set -euo pipefail
          stage=$(mktemp -d "$RUNNER_TEMP/unpacked.XXXXXX")
          tar -C "$stage" -xzf "$ARCHIVE"
          app=$(echo "$stage"/desktop-recorder-*)
          test -x "$app/desktop-recorder"
          cd "$app"
          cat > "$RUNNER_TEMP/run-unpacked.sh" << 'SCRIPT'
          set -euo pipefail
          echo "--- --help"
          ./desktop-recorder --help
          echo "--- --check"
          ./desktop-recorder --check | tee check.txt
          grep -qx 'backend: x11' check.txt
          grep -q '^ffmpeg: /' check.txt
          grep -q '^audio: ' check.txt   # "audio: none" is fine here: no sound server runs
          rm check.txt
          echo "--- GUI imports that the tray needs"
          python3 -c "import gi, Xlib, cairo; gi.require_version('Gtk', '3.0'); gi.require_version('Gst', '1.0'); gi.require_version('Notify', '0.7'); gi.require_version('AyatanaAppIndicator3', '0.1'); from gi.repository import Gtk, Gst, Notify, AyatanaAppIndicator3"
          echo "--- --smoke 1.2"
          ./desktop-recorder --smoke 1.2
          SCRIPT
          env -u PYTHONPATH dbus-run-session -- xvfb-run -a -s "-screen 0 1280x800x24" \
            bash "$RUNNER_TEMP/run-unpacked.sh"
