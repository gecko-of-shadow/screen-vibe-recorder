name: Release

# Two ways to start a release:
# - Push a tag "v<version>", for example v2.1.0.
# - Run the workflow by hand (workflow_dispatch) with a version. The workflow then makes the tag
#   on the commit that it built.
# The release notes come from packaging/release-notes/v<version>.md when that file exists.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v, for example 2.1.0"
        required: true

permissions:
  contents: write

env:
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        shell: cmd
        run: '"%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /optimize+ /out:DesktopRecorder.exe /r:System.Windows.Forms.dll /r:System.Drawing.dll /win32manifest:DesktopRecorder.manifest /win32icon:app.ico RecorderCore.cs RecordingSession.cs NativeMethods.cs RegionSelector.cs RecordingFrame.cs DesktopRecorder.cs'
      - name: Portable zip and exe
        shell: bash
        run: |
          ver="${VERSION#v}"
          bash packaging/make-windows-zip.sh DesktopRecorder.exe "$ver" "$RUNNER_TEMP"
          mkdir -p dist
          cp "$RUNNER_TEMP/screen-vibe-recorder-${ver}-windows-x64.zip" dist/
          cp DesktopRecorder.exe dist/DesktopRecorder.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: dist/*

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Portable archive
        run: |
          ver="${VERSION#v}"
          bash packaging/make-linux-tarball.sh "$ver" "$RUNNER_TEMP"
          mkdir -p dist
          cp "$RUNNER_TEMP/screen-vibe-recorder-${ver}-linux-x86_64.tar.gz" dist/
          tar -tzf dist/*.tar.gz >/dev/null
          stage=$(mktemp -d)
          tar -C "$stage" -xzf dist/*.tar.gz
          "$stage"/screen-vibe-recorder-*/desktop-recorder --help
      - uses: actions/upload-artifact@v4
        with:
          name: linux-portable
          path: dist/*.tar.gz

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-portable"
          merge-multiple: true
          path: dist
      - name: SHA-256 of each file
        run: (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Make or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${VERSION#v}"
          tag="v${ver}"
          notes="packaging/release-notes/${tag}.md"
          if [ ! -f "$notes" ]; then
            notes="$RUNNER_TEMP/notes.md"
            echo "Screen Vibe Recorder ${tag}. See CHANGELOG.md." > "$notes"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --notes-file "$notes"
          else
            gh release create "$tag" dist/* --target "$GITHUB_SHA" \
              --title "Screen Vibe Recorder ${tag}" --notes-file "$notes" --latest
          fi
